name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Undefined names (catches missing imports after refactors)
        run: python -m pyflakes bot.py pro_quant.py pro_features.py | grep "undefined name" && exit 1 || true
      - run: python -m pytest -q
